name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://ice:ice_ci_only@localhost:5432/interactive_critical_edition
  DIRECT_URL: postgres://ice:ice_ci_only@localhost:5432/interactive_critical_edition
  AUTH_SECRET: ci-only-not-a-real-secret-do-not-reuse
  AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # Dummy Supabase values so @ice/ingestion's storage client constructs at
  # import time (the CI-safe E2E specs never actually hit Storage; teardown
  # storage deletes are best-effort and swallowed).
  SUPABASE_URL: http://localhost:54321
  SUPABASE_SERVICE_ROLE_KEY: ci-only-dummy-service-role-key
  SUPABASE_STORAGE_BUCKET: documents

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ice
          POSTGRES_PASSWORD: ice_ci_only
          POSTGRES_DB: interactive_critical_edition
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # Must precede setup-node: its packageManager-based caching tries to
      # invoke pnpm to compute a cache key, so pnpm needs to already be on
      # PATH before that step runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @ice/db db:migrate

      - name: Check generated project status
        run: pnpm check:project-status

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm --filter web build

      # E2E: only the specs that need web + Postgres (no worker, no live
      # bibliographic APIs) run in CI — landing/onboarding (a11y), the
      # authorization matrix, the v2 edition reader, the Phase 9.4
      # diagnostic, the Phase 9.5 Library, the Phase 9.6 Curriculum, and the
      # Phase 9.7 knowledge-graph extension and work trash, plus the Phase 12
      # workspace shell, base auth/password-reset, and the Phase 19
      # work-status control inventory. landing-contract.spec.ts (the frozen
      # Phase 19.4 landing visual contract) joined in Phase 22.1, per the
      # plan's own deferral: its 4 checked-in Linux baselines were generated
      # through the official mcr.microsoft.com/playwright:v1.61.1-noble
      # image, and the Phase 22.1 shared-primitive extraction re-verified
      # all 4 through that same image against BOTH a dev server (modified
      # tree) and a production `next start` before wiring it here, so this
      # runner's Ubuntu + pinned-Playwright rendering matches the baselines
      # in the exact mode CI uses. All seed their data directly, so none
      # needs a worker, GROBID, or API spend —
      # buildGraph() and the trash routes are pure DB reads/writes with no
      # AI pipeline involved at all). The analysis/reader/roadmap and any
      # Phase-12/18-feature-flagged specs (writer/hardening/rag/
      # graph-expansion) still run manually against the full local stack
      # (documented in docs/PROJECT-LOG.md).
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E (CI-safe specs)
        # ANALYSIS_PIPELINE matches local dev + production (v2). Without it
        # the web tier defaults to v1 and the real /reprocess route 409s
        # ("not enabled") — exactly D-19-29's root cause — which would fail
        # the Phase 20.5 work-status reprocess tests that drive the real
        # route. Scoped to this step only; the unit-test step keeps the
        # unset-default behavior its config tests exercise explicitly.
        #
        # PHASE_18_RAG_ENABLED (D-20-55): trash.spec.ts's Phase 20.3 "trashing
        # a work removes its chunks from RAG retrieval" test drives the real
        # /api/rag/conversations HTTP surface directly. Without this flag
        # phase18RagEnabled() defaults false (see packages/config/src/
        # phase18.ts) and that route 404s before the test's own assertions
        # ever run. No AI key is configured in CI, so the deterministic
        # zero-cost fallback answers every question — this stays fully
        # deterministic, it just needed the gate open. This does not enable
        # any Phase 12 flag (writer/library-identity/interactive-reader/
        # cross-library-graph): rag.spec.ts and writer.spec.ts remain
        # excluded from the CI-safe spec list below and continue to
        # self-skip via their own `test.skip(process.env.PHASE_..._ENABLED
        # !== "true", ...)` guards.
        env:
          ANALYSIS_PIPELINE: v2
          PHASE_18_RAG_ENABLED: "true"
        run: |
          pnpm --filter web start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && break
            sleep 2
          done
          pnpm --filter web exec playwright test landing.spec.ts landing-contract.spec.ts onboarding.spec.ts security.spec.ts edition.spec.ts diagnostic.spec.ts library.spec.ts upload.spec.ts curriculum.spec.ts graph.spec.ts trash.spec.ts workspace-shell.spec.ts auth.spec.ts work-status.spec.ts
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
