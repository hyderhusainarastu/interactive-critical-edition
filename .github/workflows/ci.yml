name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://ice:ice_ci_only@localhost:5432/interactive_critical_edition
  DIRECT_URL: postgres://ice:ice_ci_only@localhost:5432/interactive_critical_edition
  AUTH_SECRET: ci-only-not-a-real-secret-do-not-reuse
  AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # Dummy Supabase values so @ice/ingestion's storage client constructs at
  # import time (the CI-safe E2E specs never actually hit Storage; teardown
  # storage deletes are best-effort and swallowed).
  SUPABASE_URL: http://localhost:54321
  SUPABASE_SERVICE_ROLE_KEY: ci-only-dummy-service-role-key
  SUPABASE_STORAGE_BUCKET: documents

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ice
          POSTGRES_PASSWORD: ice_ci_only
          POSTGRES_DB: interactive_critical_edition
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # Must precede setup-node: its packageManager-based caching tries to
      # invoke pnpm to compute a cache key, so pnpm needs to already be on
      # PATH before that step runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @ice/db db:migrate

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm --filter web build

      # E2E: only the specs that need web + Postgres (no worker, no live
      # bibliographic APIs) run in CI — landing/onboarding (a11y), the
      # authorization matrix, the v2 edition reader, the Phase 9.4
      # diagnostic, the Phase 9.5 Library, the Phase 9.6 Curriculum, and the
      # Phase 9.7 knowledge-graph extension and work trash (all seed their
      # data directly, so none needs a worker, GROBID, or API spend —
      # buildGraph() and the trash routes are pure DB reads/writes with no
      # AI pipeline involved at all). The analysis/reader/roadmap specs
      # still run manually against the full local stack (documented in
      # CLAUDE.md).
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E (CI-safe specs)
        run: |
          pnpm --filter web start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && break
            sleep 2
          done
          pnpm --filter web exec playwright test landing.spec.ts onboarding.spec.ts security.spec.ts edition.spec.ts diagnostic.spec.ts library.spec.ts curriculum.spec.ts graph.spec.ts trash.spec.ts
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
