name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://ice:ice_ci_only@localhost:5432/interactive_critical_edition
  DIRECT_URL: postgres://ice:ice_ci_only@localhost:5432/interactive_critical_edition
  AUTH_SECRET: ci-only-not-a-real-secret-do-not-reuse
  AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ice
          POSTGRES_PASSWORD: ice_ci_only
          POSTGRES_DB: interactive_critical_edition
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # Must precede setup-node: its packageManager-based caching tries to
      # invoke pnpm to compute a cache key, so pnpm needs to already be on
      # PATH before that step runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @ice/db db:migrate

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm --filter web build
